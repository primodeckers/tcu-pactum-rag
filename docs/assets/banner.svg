<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="TCU-Pactum-RAG: benchmark aberto de RAG para a jurisprudência do TCU">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14254A"/>
      <stop offset="1" stop-color="#2F5496"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>

  <!-- documentos -->
  <g transform="translate(70,70)" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <rect x="22" y="0" width="92" height="124" rx="8" opacity="0.35"/>
    <rect x="11" y="14" width="92" height="124" rx="8" opacity="0.6"/>
    <rect x="0" y="28" width="92" height="124" rx="8" fill="#14254A"/>
    <path d="M18 58h56M18 80h56M18 102h56M18 124h34" opacity="0.9"/>
  </g>

  <!-- seta -->
  <g fill="none" stroke="#F2C14E" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M210 160h54"/>
    <path d="M250 146l16 14-16 14"/>
  </g>

  <!-- lupa (recuperação) -->
  <g transform="translate(292,112)" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round">
    <circle cx="40" cy="40" r="32"/>
    <path d="M64 64l30 30"/>
    <path d="M24 40h32M40 24v32" stroke="#F2C14E" stroke-width="3"/>
  </g>

  <text x="430" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="68" font-weight="700" fill="#FFFFFF">TCU-Pactum-RAG</text>
  <text x="432" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#DCE6F7">Benchmark aberto em português para avaliar RAG</text>
  <text x="432" y="220" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="25" fill="#DCE6F7">na jurisprudência do TCU sobre licitações e contratos</text>
  <rect x="432" y="244" width="96" height="5" rx="2.5" fill="#F2C14E"/>
  <text x="432" y="280" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="19" fill="#B9C9E8">Modelos abertos em GPU local × modelos proprietários via API</text>
